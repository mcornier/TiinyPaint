<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TiinyPaint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ambient" class="ambient" aria-hidden="true"></div>

  <header class="topbar glass">
    <h1>TiinyPaint</h1>
    <div class="device">
      <button id="deviceBtn" type="button" class="btn" aria-expanded="false" aria-controls="devicePanel" disabled>
        <span id="connDot" class="dot" aria-hidden="true"></span>
        <span class="icon-slot" data-icon="cpu"></span>
        <span id="connText"></span>
        <span class="icon-slot small" data-icon="chevron-down"></span>
      </button>
      <div id="devicePanel" class="device-panel" hidden>
        <p class="panel-title" data-i18n="models"></p>
        <div id="modelList" class="model-list"></div>
        <p class="hint" data-i18n="modelsHint"></p>
      </div>
    </div>
    <div class="meter">
      <span class="meter-label">NPU</span>
      <span class="meter-track"><span id="npuBar" class="meter-fill"></span></span>
      <span id="npuText" class="meter-value">–</span>
    </div>
    <div class="meter">
      <span class="meter-label" data-i18n="memory"></span>
      <span class="meter-track"><span id="memBar" class="meter-fill"></span></span>
      <span id="memText" class="meter-value">–</span>
    </div>
    <span class="spacer"></span>
    <label class="btn language">
      <span class="icon-slot" data-icon="languages"></span>
      <select id="language" data-i18n-aria="language"></select>
    </label>
    <button id="connBtn" type="button" class="btn"></button>
  </header>

  <main class="layout">
    <aside class="panel glass controls">
      <div class="section grow">
        <div class="section-head">
          <label class="section-title" for="prompt"><span class="icon-slot small" data-icon="type"></span><span data-i18n="promptLabel"></span></label>
          <span class="section-actions">
            <button id="revertBtn" type="button" class="btn icon-btn" data-icon="undo-2" data-i18n-title="revert" data-i18n-aria="revert" hidden></button>
            <button id="enhanceBtn" type="button" class="btn small" data-icon="sparkles" data-i18n="enhance" disabled></button>
          </span>
        </div>
        <textarea id="prompt" class="field" data-i18n-placeholder="promptPlaceholder"></textarea>
      </div>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="image"></span><span data-i18n="refsLabel"></span> <span class="muted" data-i18n="refsMax"></span></p>
        <div id="refs" class="refs"></div>
        <p id="noRefs" class="hint" data-i18n="noRefs"></p>
        <p id="modeHint" class="hint"></p>
      </div>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="maximize-2"></span><span data-i18n="imageSize"></span></p>
        <div id="ratios" class="pills">
          <button type="button" class="pill" data-ratio="1:1">1:1</button>
          <button type="button" class="pill" data-ratio="3:2">3:2</button>
          <button type="button" class="pill" data-ratio="2:3">2:3</button>
          <button type="button" class="pill" data-ratio="16:9">16:9</button>
          <button type="button" class="pill" data-ratio="9:16">9:16</button>
        </div>
        <label class="line"><span data-i18n="resolution"></span>
          <select id="side" class="field">
            <option value="512" data-i18n="fast" data-i18n-n="512"></option>
            <option value="768">768</option>
            <option value="1024" selected>1024</option>
            <option value="1536">1536</option>
            <option value="2048" data-i18n="recommended" data-i18n-n="2048"></option>
          </select>
        </label>
        <div class="dims">
          <input id="width" class="field" type="number" min="32" step="32" data-i18n-aria="width">
          <span aria-hidden="true">×</span>
          <input id="height" class="field" type="number" min="32" step="32" data-i18n-aria="height">
        </div>
        <p id="sizeHint" class="hint"></p>
      </div>

      <div class="seed-row">
        <span class="section-title"><span class="icon-slot small" data-icon="dices"></span><span data-i18n="seed"></span></span>
        <span class="seed-controls">
          <span id="seedAuto" class="muted small-text" data-i18n="seedAuto"></span>
          <input id="seed" class="field seed-input" type="number" min="0" value="42" data-i18n-aria="seed" hidden>
          <button id="seedBtn" type="button" class="btn icon-btn" data-icon="dices"></button>
        </span>
      </div>

      <button id="generateBtn" type="button" class="btn primary" data-icon="play" data-i18n="generate"></button>
      <button id="stopBtn" type="button" class="btn danger" data-icon="square" data-i18n="stop" hidden></button>
    </aside>

    <section class="stage">
      <div id="editBar" class="edit-bar glass" hidden>
        <div id="tools" class="tools" role="toolbar">
          <button type="button" data-tool="mask" data-icon="paintbrush" data-i18n="toolMask"></button>
          <button type="button" data-tool="erase" data-icon="eraser" data-i18n="toolErase"></button>
          <button type="button" data-tool="lasso" data-icon="lasso" data-i18n="toolLasso"></button>
          <button type="button" data-tool="rect" data-icon="square-dashed" data-i18n="toolRect"></button>
          <button type="button" data-tool="restore" data-icon="history" data-i18n="toolRestore"></button>
          <button type="button" data-tool="stamp" data-icon="stamp" data-i18n="toolStamp"></button>
          <button type="button" data-tool="crop" data-icon="crop" data-i18n="toolCrop"></button>
        </div>
        <div class="tool-actions">
          <button id="undoBtn" type="button" class="btn small" data-icon="undo-2" data-i18n="undo"></button>
          <button id="redoBtn" type="button" class="btn small" data-icon="redo-2" data-i18n="redo"></button>
          <button id="zoomResetBtn" type="button" class="btn small" data-icon="maximize" data-i18n="zoomReset"></button>
          <button id="closeEditorBtn" type="button" class="btn small" data-icon="x" data-i18n="closeEditor"></button>
        </div>

        <div class="options">
          <label class="opt" data-for="brush"><span data-i18n="brush"></span>
            <input id="brushSize" type="range" min="4" max="500" value="64"><output id="brushValue"></output></label>
          <label class="opt" data-for="mask"><span data-i18n="feather"></span>
            <input id="feather" type="range" min="0" max="80" value="16"><output id="featherValue"></output></label>
          <label class="opt check" data-for="mask"><input id="showMask" type="checkbox" checked> <span data-i18n="showMask"></span></label>
          <button id="invertBtn" type="button" class="btn small" data-for="mask" data-i18n="invert"></button>
          <button id="clearMaskBtn" type="button" class="btn small" data-for="mask" data-i18n="clearMask"></button>
          <label class="opt" data-for="mask"><span data-i18n="method"></span>
            <select id="method" class="field compact">
              <option value="fill" data-i18n="methodFill"></option>
              <option value="keep" data-i18n="methodKeep"></option>
            </select></label>
          <label class="opt" data-for="mask"><span data-i18n="scope"></span>
            <select id="scope" class="field compact">
              <option value="crop" data-i18n="scopeCrop"></option>
              <option value="full" data-i18n="scopeFull"></option>
            </select></label>
          <label class="opt" data-for="restore"><span data-i18n="source"></span>
            <select id="source" class="field compact"></select></label>
          <button id="copySourceBtn" type="button" class="btn small" data-for="restore" data-i18n="copyFromSource"></button>
          <label class="opt" data-for="crop"><span data-i18n="cropRatio"></span>
            <select id="cropRatio" class="field compact">
              <option value="" data-i18n="cropFree"></option>
              <option value="1:1">1:1</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
              <option value="3:2">3:2</option>
              <option value="2:3">2:3</option>
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>
            </select></label>
          <button id="applyCropBtn" type="button" class="btn small" data-for="crop" data-i18n="applyCrop"></button>
          <span class="opt" data-for="crop"><span data-i18n="extend"></span>
            <button type="button" class="btn small" data-extend="left" data-i18n="left"></button>
            <button type="button" class="btn small" data-extend="right" data-i18n="right"></button>
            <button type="button" class="btn small" data-extend="top" data-i18n="top"></button>
            <button type="button" class="btn small" data-extend="bottom" data-i18n="bottom"></button></span>
          <button id="rotateBtn" type="button" class="btn small" data-for="crop" data-icon="rotate-cw" data-i18n="rotate"></button>
          <button id="flipBtn" type="button" class="btn small" data-for="crop" data-icon="flip-horizontal" data-i18n="flip"></button>
        </div>
        <p id="toolHint" class="hint tool-hint"></p>
      </div>

      <div id="frameBar" class="frame-bar glass">
        <span id="frameInfo" class="frame-info"></span>
        <button id="editBtn" type="button" class="btn icon-btn" data-icon="paintbrush" data-i18n-title="editImage" data-i18n-aria="editImage" disabled></button>
        <a id="downloadBtn" class="btn icon-btn disabled" aria-disabled="true" data-icon="download" data-i18n-title="download" data-i18n-aria="download"></a>
        <button id="clearViewBtn" type="button" class="btn icon-btn" data-icon="x" data-i18n-title="clearView" data-i18n-aria="clearView" disabled></button>
      </div>

      <div id="canvas" class="canvas">
        <div id="frame" class="frame" tabindex="0">
          <img id="output" alt="" hidden>
          <span id="previewBadge" class="preview-badge" hidden>
            <span id="previewStep"></span><span class="preview-hover" data-i18n="previewHover"></span>
          </span>
        </div>
        <canvas id="editCanvas" class="edit-canvas" hidden></canvas>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <aside id="contextPanel" class="panel glass context">
      <div class="context-head">
        <h2 data-i18n="contextImages"></h2>
        <span id="refCount" class="muted"></span>
      </div>
      <button id="uploadBtn" type="button" class="btn dashed" data-icon="upload" data-i18n="loadImages"></button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <div id="gallery" class="gallery"></div>
      <button id="clearHistoryBtn" type="button" class="btn" data-icon="trash-2" data-i18n="clearHistory" disabled></button>
    </aside>
  </main>

  <section id="graph" class="graph" data-i18n-aria="pipeline">
    <div class="graph-side">
      <span id="linkPe" class="link-pe"></span>
      <span id="linkPrompt" class="link link-prompt"></span>
      <div id="nodePe" class="node node-pe">
      <div class="node-row">
        <span class="icon-slot" data-icon="sparkles"></span>
        <select id="enhancer" class="field" data-i18n-aria="enhancerLabel"></select>
        <button id="peToggle" type="button" class="btn icon-btn expand" aria-expanded="false" data-i18n-aria="enhancerSettings"></button>
      </div>
      <div id="peBody" class="node-body" hidden>
        <p id="peHint" class="hint"></p>
        <label class="line"><span data-i18n="temperature"></span><input id="temperature" class="field num" type="number" min="0" max="2" step="0.05" value="1"></label>
        <label class="line"><span data-i18n="topP"></span><input id="topP" class="field num" type="number" min="0" max="1" step="0.01" value="0.95"></label>
        <label class="line"><span data-i18n="topK"></span><input id="topK" class="field num" type="number" min="1" max="200" value="20"></label>
        <details id="thinkingBox" hidden>
          <summary id="thinkingSummary"></summary>
          <pre id="thinking" class="scroll-text"></pre>
        </details>
      </div>
    </div>
    </div>

    <div class="graph-main">
      <div id="wirePrompt" class="wire grow"></div>
    <div class="model-col">
      <div id="nodeModel" class="node node-model">
        <div class="node-row">
          <span class="icon-slot" data-icon="box"></span>
          <select id="imageModel" class="field" data-i18n-aria="imageModel"></select>
          <button id="modelToggle" type="button" class="btn icon-btn expand" aria-expanded="false" data-i18n-aria="modelSettings"></button>
        </div>
        <div id="modelBody" class="node-body" hidden>
          <label class="line"><span data-i18n="scheduler"></span>
            <select id="scheduler" class="field">
              <option value="" data-i18n="schedulerDefault"></option>
              <option value="euler">euler</option>
              <option value="euler_ancestral_rf">euler_ancestral_rf</option>
              <option value="unipc_flow">unipc_flow</option>
            </select>
          </label>
          <label class="line"><span data-i18n="guidance"></span><input id="guidance" class="field num" type="number" min="0" max="20" step="0.1" value="1"></label>
          <label class="stack"><span data-i18n="negative"></span><input id="negative" class="field" type="text"></label>
          <p id="negativeHint" class="hint"></p>
          <label class="check-line"><input id="earlyPreview" type="checkbox"> <span data-i18n="earlyPreview"></span></label>
          <p id="earlyHint" class="hint"></p>
        </div>
      </div>
      <div id="loop" class="loop">
        <span class="loop-head"></span>
        <div class="badge-pill loop-pill">
          <span id="loopIcon" class="icon-slot small" data-icon="repeat"></span>
          <input id="steps" class="steps" type="number" min="1" max="100" value="40" data-i18n-aria="steps">
          <span id="stepNow" class="step-now" hidden></span>
          <span data-i18n="stepsUnit"></span>
        </div>
      </div>
    </div>

    <div id="previewBranch" class="wire-col">
      <div id="wire4" class="wire"></div>
      <span class="branch branch-in"></span>
      <span class="branch branch-out"></span>
      <label id="previewPill" class="badge-pill preview-pill">
        <span class="icon-slot small" data-icon="eye"></span>
        <select id="previewMode" data-i18n-aria="previewLabel">
          <option value="0" data-i18n="previewOff"></option>
          <option value="8">1/8</option>
          <option value="4">1/4</option>
          <option value="2">1/2</option>
          <option value="1">1</option>
        </select>
      </label>
    </div>

    <div id="nodeOutput" class="node node-output" data-i18n-title="finalImage">
      <span class="icon-slot large" data-icon="image"></span>
    </div>
      <div id="wireContext" class="wire grow no-head"></div>
    </div>

    <div class="graph-end">
      <span id="linkContext" class="link link-context"></span>
    </div>
  </section>

  <div id="pickerMenu" class="picker-menu" hidden></div>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2 data-i18n="settingsTitle"></h2>
      <div class="dialog-field">
        <label for="baseUrl" data-i18n="address"></label>
        <input id="baseUrl" class="field" type="text" placeholder="http://tiinyhost.local" spellcheck="false" required>
        <p class="hint" data-i18n="addressHint"></p>
      </div>
      <div class="dialog-field">
        <label for="apiKey" data-i18n="apiKey"></label>
        <input id="apiKey" class="field" type="password" autocomplete="off" spellcheck="false" required>
        <p class="hint" data-i18n="apiKeyHint"></p>
      </div>
      <p id="settingsError" class="error" role="alert"></p>
      <div class="row end">
        <button type="button" id="settingsCancel" class="btn" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" value="save" data-i18n="connect"></button>
      </div>
    </form>
  </dialog>

  <script src="prompts.js"></script>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="api.js"></script>
  <script src="session.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
